<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公告</title>
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at top left, #000000 40%, #1a1c4d 70%, #151985 100%);
      color: #ffffff;
      font-family: "Courier New", monospace;
      min-height: 100vh; 
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      display: flex;
      padding: 20px 40px;
      position: relative;
      z-index: 1;
      border-bottom: 2px solid transparent;
      overflow: hidden;
      height: 90px;
      top: 0%;
      margin-left: 0%;
      margin-right: 0%;
      width: 100% ;
    }
    header::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      width: 100%;
      background: linear-gradient(90deg, transparent, #00ffff, transparent);
      background-size: 200% 100%;
      animation: flowline 8s linear infinite;
    }
    @keyframes flowline {
      0% {
        transform: translateX(-100%) translateY(0);
      }
      49.9% {
        transform: translateX(0%) translateY(0); 
      }
      50% {
        transform: translateX(0%) translateY(0); 
      }
      100% {
        transform: translateX(130%) translateY(-130px); 
      }
    }

    .title {
      margin-right: 40px;
      font-weight: bold;
      color: #ffffff;
    }

    .menu {
      display: flex;
      width: 100%;
      align-items: center;
    }

    .menu a {
      margin-right: 50px;
      color: #ffffff;
      text-decoration: none;
      font-size: 1.1em;
    }

    .menu a:hover {
      text-decoration: underline;
    }

    main {
      padding: 60px;
      text-align: left;
      font-size: 1.4em;
      line-height: 1.8;
    }

    h1 {
      margin: 0;
      letter-size: 18px;
      margin-bottom: 50px;
      font-size: clamp(13px, 1.8vw, 18px); 
      padding-left : 7%;
    }

    h2 {
      margin: 0;
      font-size: clamp(13px, 1.8vw, 18px); 
      color: #00e8ff;
      padding-left : 7%;
    }
    .bs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 24px;
    }
    th, td {
      border: 1px solid #000;
      padding: 6px 10px;
    }
　　　tr.section td {
      background-color: #f3f3f3;
      font-weight: bold;
    }
    .num {
      text-align: right;
    }
    table th:last-child,
    table td:last-child {
      text-align: right;
      padding-right: 12px;
    }
  </style>
</head>
<body>

  <header>
    <div class="title"></div>
    <nav class="menu">
      <a href="index.html">ホーム</a>
      <a href="eda.html">公告</a>
    </nav>
  </header>

  <main>

    <p>
    ExeMe株式会社<br>
    記載日：2026年1月14日

    <div class = "bs-grid">
      <section>
        <h2>資産の部</h2>
        <table>
          <tr><th>科目</th><th>金額（円）</th></tr>
          <tr class="section"><td>流動資産</td></tr>
          <tr><td>現金及び預金</td><td class = "num">9025958</td></tr>
          <tr><td>前払費用</td><td class = "num">616000</td></tr>
          <tr><td>前払保険料</td><td class = "num">18334</td></tr>
　　　　　　<tr class="section"><td>繰延資産</td></tr>
          <tr><td>創立費</td><td class = "num">241750</td></tr>
          <tr><td>資産合計</td><td class = "num">9902042</td></tr>
        </table>
      </section>
      <section>
        <h2>負債の部</h2>
        <table>
          <tr><th>科目</th><th>金額（円）</th></tr>
　　　　　　<tr class="section"><td>固定負債</td></tr>
          <tr><td>代表者借入金</td><td class = "num">1084991</td></tr>
        </table>
        <h2>純資産の部</h2>
        <table>
          <tr><th>科目</th><th>金額（円）</th></tr>
          <tr><td>資本金</td><td class = "num">9000000</td></tr>
          <tr><td>当期純損失</td><td class = "num">182949</td></tr>
          <tr><td>負債及び純資産合計</td><td class = "num">9902042</td></tr>
        </table>
      </section>
    </div>
  </main>

</body>
</html>
